name: Release

# Ein Release entsteht, wenn auf den Branch "release" hochgeladen wird (oder manuell über "Run workflow").
# Die Version kommt aus launcher/main.py (VERSION = "..."); Tag v<Version> und Release legt der Workflow selbst an.
# Gibt es das Release zu dieser Version schon, passiert nichts (Version vorher erhöhen).
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Select-String -Path launcher/main.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "Release v$v existiert schon - nichts zu tun" }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"
      - name: Paket bauen
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./launcher/build.ps1 -OwnBootloader -Version "${{ steps.ver.outputs.version }}"
      - name: Prüfsummen
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $zip = Get-ChildItem launcher/release/*.zip | Select-Object -First 1
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$h  $($zip.Name)" | Set-Content launcher/release/SHA256SUMS.txt
          Get-Content launcher/release/SHA256SUMS.txt
      - name: GitHub-Release anlegen
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { $notes = $null }
          # Bewusst kein --prerelease: Pre-releases zeigt GitHub nicht in der Seitenleiste "Releases" an.
          $pre = @("--latest")
          $files = @((Get-ChildItem launcher/release/*.zip).FullName, "launcher/release/SHA256SUMS.txt")
          $common = @("--target", "${{ github.sha }}", "--title", "Race-O-Rama Online $tag")
          if ($notes) { gh release create $tag @files @common --notes-file $notes @pre }
          else { gh release create $tag @files @common --generate-notes @pre }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
